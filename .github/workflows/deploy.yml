name: Deploy daniel-site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # BEFORE build — post-deploy the live sitemap equals the new one, so a
      # later fetch would always diff empty. This snapshot makes the
      # changed-only IndexNow ping meaningful.
      - name: Snapshot live sitemap (IndexNow baseline)
        run: |
          curl -fsS --max-time 30 https://danielchristopherfox.com/sitemap.xml \
            -o /tmp/live-sitemap.xml \
            || echo "live sitemap unavailable — IndexNow will submit all URLs"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build site
        run: python3 build.py
      - name: Stage site files
        run: |
          mkdir -p _site
          # Copy the whole built site, excluding source and tooling.
          # rsync (not a hand-picked cp list) so new output dirs like
          # notes/ and essays/ and assets like sitemap.xml are never missed.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_src' \
            --exclude='_site' \
            --exclude='build.py' \
            --exclude='README.md' \
            --exclude='__pycache__' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Runs at the end of the build job (the deploy job is a separate runner
      # with no checkout or /tmp carryover). The ping therefore fires ~a
      # minute before Pages finishes publishing — accepted: engines fetch
      # asynchronously, well after the deploy lands. Changed-only vs the
      # pre-build snapshot; the script swallows its own errors.
      - name: Ping IndexNow (changed URLs only)
        run: python3 _tools/indexnow.py --baseline /tmp/live-sitemap.xml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
